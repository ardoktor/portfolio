<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Arda Asut — AI products for real workflows{% endblock %}</title>
    <meta name="description" content="I build AI products that professionals use in their actual workflow. Currently ConsulDent, a clinical assistant for dentists, live on the App Store.">

    <meta property="og:type"        content="website">
    <meta property="og:title"       content="Arda Asut — AI products for real workflows">
    <meta property="og:description" content="Currently building ConsulDent, a clinical AI assistant for dentists. Live on the App Store.">
    <meta property="og:image"       content="https://ardaasut.com{% static 'main/img/og.png' %}">
    <meta property="og:url"         content="https://ardaasut.com/">
    <meta name="twitter:card"       content="summary_large_image">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Shell first, then the shared theme; pages add their own sheet below. -->
    <link rel="stylesheet" href="{% static 'main/css/style.css' %}">
    <link rel="stylesheet" href="{% static 'main/css/quiet.css' %}">

    {% block extra_css %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
    <!-- Navigation -->
    <nav class="site-nav">
        <div class="site-nav-inner">
            <ul class="nav-list">
                <li><a href="{% url 'home' %}">Home</a></li>
                <li><a href="{% url 'projects' %}">Projects</a></li>
                <li><a href="{% url 'blog' %}">Notes</a></li>
            </ul>
        </div>
    </nav>

    <!-- Main Content -->
    <main>
        {% block content %}{% endblock %}
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-inner">
            <div class="footer-left">
                <span class="footer-brand">ardoktor</span>
                <span class="footer-copy">&copy; {% now "Y" %}</span>
            </div>
            <div class="footer-right">
                <a href="mailto:arda.asutt@gmail.com">Mail</a>
                <a href="https://github.com/ardoktor" target="_blank" rel="noopener">GitHub</a>
                <a href="https://linkedin.com/in/arda-asut-109800172" target="_blank" rel="noopener">LinkedIn</a>
                <a href="{% url 'about' %}">About</a>
                <a href="{% static 'main/files/arda-asut-cv.pdf' %}" target="_blank" rel="noopener">CV</a>
            </div>
        </div>
    </footer>

    {% block extra_js %}{% endblock %}
</body>
</html>
